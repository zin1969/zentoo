openapi: 3.1.0

info:
  title: Zentoo API
  description: |
    複式簿記ベースのお小遣い帳 API。

    Next.js (BFF) から Rails API を呼び出す内部 API であり、Browser から直接は呼ばれない。
    ログイン以外のエンドポイントは `Authorization: Bearer <JWT>` が必須。
  version: 1.0.0

servers:
  - url: http://localhost:53000
    description: Local development (docker compose)

tags:
  - name: auth
    description: 認証
  - name: accounts
    description: 勘定科目マスタ
  - name: journals
    description: 仕訳
  - name: reports
    description: 残高・支出の集計

paths:
  /login:
    $ref: './paths/auth.yaml#/login'
  /asset-accounts:
    $ref: './paths/accounts.yaml#/asset-accounts'
  /asset-accounts/{id}:
    $ref: './paths/accounts.yaml#/asset-account'
  /liability-accounts:
    $ref: './paths/accounts.yaml#/liability-accounts'
  /expense-accounts:
    $ref: './paths/accounts.yaml#/expense-accounts'
  /expense-accounts/{id}:
    $ref: './paths/accounts.yaml#/expense-account'
  /credit-cards:
    $ref: './paths/accounts.yaml#/credit-cards'
  /credit-cards/{id}:
    $ref: './paths/accounts.yaml#/credit-card'
  /journals:
    $ref: './paths/journals.yaml#/journals'
  /journals/{id}:
    $ref: './paths/journals.yaml#/journal'
  /asset-opening-journals:
    $ref: './paths/journals.yaml#/asset-opening-journals'
  /journal-entries:
    $ref: './paths/journals.yaml#/journal-entries'
  /journal-entries/{id}:
    $ref: './paths/journals.yaml#/journal-entry'
  /liability-opening-journals:
    $ref: './paths/journals.yaml#/liability-opening-journals'
  /cash-deposit-journals:
    $ref: './paths/journals.yaml#/cash-deposit-journals'
  /direct-debit-journals/{id}:
    $ref: './paths/journals.yaml#/direct-debit-journal'
  /account-balances:
    $ref: './paths/reports.yaml#/account-balances'
  /monthly-expenses:
    $ref: './paths/reports.yaml#/monthly-expenses'
  /bank-account-ledgers/{id}:
    $ref: './paths/reports.yaml#/bank-account-ledger'

components:
  securitySchemes:
    bearerAuth:
      $ref: './components/security.yaml#/bearerAuth'
  schemas:
    ErrorResponse:
      $ref: './schemas/error.yaml#/ErrorResponse'
    LoginRequest:
      $ref: './schemas/auth.yaml#/LoginRequest'
    LoginResponse:
      $ref: './schemas/auth.yaml#/LoginResponse'
    AssetAccount:
      $ref: './schemas/accounts.yaml#/AssetAccount'
    LiabilityAccount:
      $ref: './schemas/accounts.yaml#/LiabilityAccount'
    ExpenseAccount:
      $ref: './schemas/accounts.yaml#/ExpenseAccount'
    AssetAccountRequest:
      $ref: './schemas/accounts.yaml#/AssetAccountRequest'
    CreditCard:
      $ref: './schemas/accounts.yaml#/CreditCard'
    CreditCardRequest:
      $ref: './schemas/accounts.yaml#/CreditCardRequest'
    ExpenseAccountRequest:
      $ref: './schemas/accounts.yaml#/ExpenseAccountRequest'
    AccountSavedResponse:
      $ref: './schemas/accounts.yaml#/AccountSavedResponse'
    CreateOpeningAssetBalanceJournalRequest:
      $ref: './schemas/journals.yaml#/CreateOpeningAssetBalanceJournalRequest'
    CreateOpeningLiabilityBalanceJournalRequest:
      $ref: './schemas/journals.yaml#/CreateOpeningLiabilityBalanceJournalRequest'
    CreateCashDepositJournalRequest:
      $ref: './schemas/journals.yaml#/CreateCashDepositJournalRequest'
    JournalCreatedResponse:
      $ref: './schemas/journals.yaml#/JournalCreatedResponse'
    InsertJournalEntryRequest:
      $ref: './schemas/journals.yaml#/InsertJournalEntryRequest'
    UpdateDirectDebitDateRequest:
      $ref: './schemas/journals.yaml#/UpdateDirectDebitDateRequest'
    JournalList:
      $ref: './schemas/journals.yaml#/JournalList'
    Journal:
      $ref: './schemas/journals.yaml#/Journal'
    AccountBalance:
      $ref: './schemas/reports.yaml#/AccountBalance'
    AccountBalances:
      $ref: './schemas/reports.yaml#/AccountBalances'
    MonthlyExpense:
      $ref: './schemas/reports.yaml#/MonthlyExpense'
    MonthlyExpenses:
      $ref: './schemas/reports.yaml#/MonthlyExpenses'
    LedgerItem:
      $ref: './schemas/reports.yaml#/LedgerItem'
    LedgerEntry:
      $ref: './schemas/reports.yaml#/LedgerEntry'
    BankAccountLedger:
      $ref: './schemas/reports.yaml#/BankAccountLedger'
