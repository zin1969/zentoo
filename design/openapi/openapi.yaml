openapi: 3.1.0

info:
  title: Zentoo API
  description: |
    複式簿記ベースのお小遣い帳 API。

    Next.js (BFF) から Rails API を呼び出す内部 API であり、Browser から直接は呼ばれない。
    ログイン以外のエンドポイントは `Authorization: Bearer <JWT>` が必須。
  version: 1.0.0

servers:
  - url: http://localhost:53000
    description: Local development (docker compose)

tags:
  - name: auth
    description: 認証
  - name: accounts
    description: 勘定科目マスタ
  - name: journals
    description: 仕訳
  - name: reports
    description: 残高・支出の集計
  - name: tags
    description: タグ（明細に付ける目的）
  - name: recurring_entries
    description: 決まった支払い（回ごとに確かめてから登録する）

paths:
  /login:
    $ref: './paths/auth.yaml#/login'
  /asset-accounts:
    $ref: './paths/accounts.yaml#/asset-accounts'
  /asset-accounts/{id}:
    $ref: './paths/accounts.yaml#/asset-account'
  /liability-accounts:
    $ref: './paths/accounts.yaml#/liability-accounts'
  /expense-accounts:
    $ref: './paths/accounts.yaml#/expense-accounts'
  /expense-accounts/{id}:
    $ref: './paths/accounts.yaml#/expense-account'
  /revenue-accounts:
    $ref: './paths/accounts.yaml#/revenue-accounts'
  /revenue-accounts/{id}:
    $ref: './paths/accounts.yaml#/revenue-account'
  /credit-cards:
    $ref: './paths/accounts.yaml#/credit-cards'
  /credit-cards/{id}:
    $ref: './paths/accounts.yaml#/credit-card'
  /journals:
    $ref: './paths/journals.yaml#/journals'
  /journals/{id}:
    $ref: './paths/journals.yaml#/journal'
  /asset-opening-journals:
    $ref: './paths/journals.yaml#/asset-opening-journals'
  /journal-entries:
    $ref: './paths/journals.yaml#/journal-entries'
  /journal-entries/{id}:
    $ref: './paths/journals.yaml#/journal-entry'
  /liability-opening-journals:
    $ref: './paths/journals.yaml#/liability-opening-journals'
  /cash-deposit-journals:
    $ref: './paths/journals.yaml#/cash-deposit-journals'
  /direct-debit-journals/{id}:
    $ref: './paths/journals.yaml#/direct-debit-journal'
  /income-journals:
    $ref: './paths/journals.yaml#/income-journals'
  /income-journals/{id}:
    $ref: './paths/journals.yaml#/income-journal'
  /stock-trades:
    $ref: './paths/journals.yaml#/stock-trades'
  /transfer-journals:
    $ref: './paths/journals.yaml#/transfer-journals'
  /transfer-journals/{id}:
    $ref: './paths/journals.yaml#/transfer-journal'
  /account-balances:
    $ref: './paths/reports.yaml#/account-balances'
  /stock-holdings:
    $ref: './paths/reports.yaml#/stock-holdings'
  /monthly-expenses:
    $ref: './paths/reports.yaml#/monthly-expenses'
  /bank-account-ledgers/{id}:
    $ref: './paths/reports.yaml#/bank-account-ledger'
  /tag-reports/{id}:
    $ref: './paths/reports.yaml#/tag-report'
  /tag-reports/{id}/items:
    $ref: './paths/reports.yaml#/tag-report-items'
  /tags:
    $ref: './paths/tags.yaml#/tags'
  /tags/{id}:
    $ref: './paths/tags.yaml#/tag'
  /recurring-entries:
    $ref: './paths/recurring_entries.yaml#/recurring-entries'
  /recurring-entries/{id}:
    $ref: './paths/recurring_entries.yaml#/recurring-entry'
  /recurring-entries/pending:
    $ref: './paths/recurring_entries.yaml#/pending-occurrences'
  /recurring-entries/{id}/occurrences:
    $ref: './paths/recurring_entries.yaml#/occurrences'
  /recurring-entries/{id}/skips:
    $ref: './paths/recurring_entries.yaml#/skips'

