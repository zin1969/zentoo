account-balances:
  get:
    tags: [reports]
    summary: 指定日時点の残高
    description: |
      認証済みユーザーの資産・負債科目ごとの残高と、その合計を返す。
      資産の残高は借方 − 貸方、負債の残高（未払いの額）は貸方 − 借方。基準日（含む）までの仕訳で計算する。
      仕訳の無い科目も残高 0 で返す。
      参照のみの API なので本文に `next_token` は含めず、新しいトークンはレスポンスヘッダ `X-Next-Token` で返す。
    operationId: getAccountBalances
    security:
      - bearerAuth: []
    parameters:
      - name: date
        in: query
        description: 基準日（この日を含む）。省略すると今日（日本時間）。
        schema:
          type: string
          format: date
    responses:
      '200':
        description: 科目ごとの残高と合計
        content:
          application/json:
            schema:
              $ref: '../schemas/reports.yaml#/AccountBalances'
      '401':
        description: 未認証
        content:
          application/json:
            schema:
              $ref: '../schemas/error.yaml#/ErrorResponse'
      '422':
        description: 基準日の指定が不正（`errors`）
        content:
          application/json:
            schema:
              $ref: '../schemas/error.yaml#/ErrorResponse'

stock-holdings:
  get:
    tags: [reports]
    summary: 銘柄ごとの株数・取得額
    description: |
      認証済みユーザーの現物株の銘柄（種別「投資」の口座で、株数を持つ明細があるもの）ごとに、
      基準日（含む）までの仕訳から株数・取得額・平均取得単価を返す。
      内部で PostgreSQL 関数 `get_stock_holdings` を呼び出す。
      参照のみの API なので本文に `next_token` は含めず、新しいトークンはレスポンスヘッダ `X-Next-Token` で返す。
    operationId: getStockHoldings
    security:
      - bearerAuth: []
    parameters:
      - name: date
        in: query
        description: 基準日（この日を含む）。省略すると今日（日本時間）。
        schema:
          type: string
          format: date
    responses:
      '200':
        description: 銘柄ごとの株数・取得額
        content:
          application/json:
            schema:
              $ref: '../schemas/reports.yaml#/StockHoldings'
      '401':
        description: 未認証
        content:
          application/json:
            schema:
              $ref: '../schemas/error.yaml#/ErrorResponse'
      '422':
        description: 基準日の指定が不正（`errors`）
        content:
          application/json:
            schema:
              $ref: '../schemas/error.yaml#/ErrorResponse'

monthly-expenses:
  get:
    tags: [reports]
    summary: 月次の収支
    description: |
      認証済みユーザーの費用を、対象月の費用科目ごとに集計して、金額の大きい順に返す（`total`・`items`）。
      あわせて、収入を収益科目ごとに集計し（`income_total`・`income_items`）、収支（`net` = 収入 − 支出）を返す。
      仕訳日が対象月の仕訳で数える。カード払いは買い物をした日の月に計上する。
      参照のみの API なので本文に `next_token` は含めず、新しいトークンはレスポンスヘッダ `X-Next-Token` で返す。
    operationId: getMonthlyExpenses
    security:
      - bearerAuth: []
    parameters:
      - name: month
        in: query
        description: 対象月（`YYYY-MM`）。省略すると今月（日本時間）。
        schema:
          type: string
          pattern: '^\d{4}-(0[1-9]|1[0-2])$'
          examples:
            - '2026-10'
    responses:
      '200':
        description: 科目ごとの支出・収入と合計、収支（該当が無い月は合計が 0、一覧が空配列）
        content:
          application/json:
            schema:
              $ref: '../schemas/reports.yaml#/MonthlyExpenses'
      '401':
        description: 未認証
        content:
          application/json:
            schema:
              $ref: '../schemas/error.yaml#/ErrorResponse'
      '422':
        description: 対象月の指定が不正（`errors`）
        content:
          application/json:
            schema:
              $ref: '../schemas/error.yaml#/ErrorResponse'

bank-account-ledger:
  get:
    tags: [reports]
    summary: 預金口座の通帳
    description: |
      認証済みユーザーの預金口座の、期間内の出入金を、銀行の通帳のように日付順で返す。未来の引き落とし予定も含む。
      1 行目は繰越（期間の初日の前日までの残高）で、各行の残高は繰越から積み上げる。
      カードの引き落としは、同じ日・同じカードの分を 1 行にまとめ、元のお買い物の内訳（`items`）を付ける。
      内部で PostgreSQL 関数 `get_bank_account_ledger` を呼び出す。
      参照のみの API なので本文に `next_token` は含めず、新しいトークンはレスポンスヘッダ `X-Next-Token` で返す。
    operationId: getBankAccountLedger
    security:
      - bearerAuth: []
    parameters:
      - name: id
        in: path
        required: true
        description: 預金口座の ID
        schema:
          type: integer
          minimum: 1
      - name: from
        in: query
        description: 期間の開始日（この日を含む）。省略すると先月の初め（日本時間）
        schema:
          type: string
          format: date
      - name: to
        in: query
        description: 期間の終了日（この日を含む）。省略すると、口座の最後の予定日（今月末より前なら今月末）。`from` より前は指定できない
        schema:
          type: string
          format: date
    responses:
      '200':
        description: 通帳
        content:
          application/json:
            schema:
              $ref: '../schemas/reports.yaml#/BankAccountLedger'
      '401':
        description: 未認証
        content:
          application/json:
            schema:
              $ref: '../schemas/error.yaml#/ErrorResponse'
      '404':
        description: 口座が存在しない、他ユーザーの口座、または預金ではない口座（`asset_account_not_found`。区別しない）
        content:
          application/json:
            schema:
              $ref: '../schemas/error.yaml#/ErrorResponse'
      '422':
        description: 期間の指定が不正（`errors`）
        content:
          application/json:
            schema:
              $ref: '../schemas/error.yaml#/ErrorResponse'

tag-report:
  get:
    tags: [reports]
    summary: タグの集計（年の月ごと）
    description: |
      認証済みユーザーのタグについて、そのタグが付いた費用の明細を、年の月ごと（1〜12 月）に合計して返す。日付は仕訳日（買った日）で数える。
      1 つの明細に複数のタグを付けた場合は、それぞれのタグで数える（タグごとの合計を足しても、支出の合計とは合わない）。
      内部で PostgreSQL 関数 `get_tag_monthly_totals` を呼び出す。
      参照のみの API なので本文に `next_token` は含めず、新しいトークンはレスポンスヘッダ `X-Next-Token` で返す。
    operationId: getTagReport
    security:
      - bearerAuth: []
    parameters:
      - name: id
        in: path
        required: true
        description: タグの ID
        schema:
          type: integer
          minimum: 1
      - name: year
        in: query
        description: 対象の年（`YYYY`、2000〜2100）。省略すると今年（日本時間）
        schema:
          type: string
          pattern: '^\d{4}$'
    responses:
      '200':
        description: 年の合計と、月ごとの合計
        content:
          application/json:
            schema:
              $ref: '../schemas/tags.yaml#/TagReport'
      '401':
        description: 未認証
        content:
          application/json:
            schema:
              $ref: '../schemas/error.yaml#/ErrorResponse'
      '404':
        description: タグが存在しない、または他ユーザーのタグ（`tag_not_found`）
        content:
          application/json:
            schema:
              $ref: '../schemas/error.yaml#/ErrorResponse'
      '422':
        description: 年の指定が不正（`errors`）
        content:
          application/json:
            schema:
              $ref: '../schemas/error.yaml#/ErrorResponse'

tag-report-items:
  get:
    tags: [reports]
    summary: タグの集計（月の明細）
    description: |
      認証済みユーザーのタグについて、対象月にそのタグが付いた費用の明細を、仕訳日・明細の順に返す。
      内部で PostgreSQL 関数 `get_tag_items` を呼び出す。
      参照のみの API なので本文に `next_token` は含めず、新しいトークンはレスポンスヘッダ `X-Next-Token` で返す。
    operationId: getTagReportItems
    security:
      - bearerAuth: []
    parameters:
      - name: id
        in: path
        required: true
        description: タグの ID
        schema:
          type: integer
          minimum: 1
      - name: month
        in: query
        description: 対象月（`YYYY-MM`）。省略すると今月（日本時間）
        schema:
          type: string
          pattern: '^\d{4}-(0[1-9]|1[0-2])$'
    responses:
      '200':
        description: 月の明細と、その合計
        content:
          application/json:
            schema:
              $ref: '../schemas/tags.yaml#/TagReportItems'
      '401':
        description: 未認証
        content:
          application/json:
            schema:
              $ref: '../schemas/error.yaml#/ErrorResponse'
      '404':
        description: タグが存在しない、または他ユーザーのタグ（`tag_not_found`）
        content:
          application/json:
            schema:
              $ref: '../schemas/error.yaml#/ErrorResponse'
      '422':
        description: 月の指定が不正（`errors`）
        content:
          application/json:
            schema:
              $ref: '../schemas/error.yaml#/ErrorResponse'

