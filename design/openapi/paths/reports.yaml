account-balances:
  get:
    tags: [reports]
    summary: 指定日時点の残高
    description: |
      認証済みユーザーの資産・負債科目ごとの残高と、その合計を返す。
      資産の残高は借方 − 貸方、負債の残高（未払いの額）は貸方 − 借方。基準日（含む）までの仕訳で計算する。
      仕訳の無い科目も残高 0 で返す。
      参照のみの API なので本文に `next_token` は含めず、新しいトークンはレスポンスヘッダ `X-Next-Token` で返す。
    operationId: getAccountBalances
    security:
      - bearerAuth: []
    parameters:
      - name: date
        in: query
        description: 基準日（この日を含む）。省略すると今日（日本時間）。
        schema:
          type: string
          format: date
    responses:
      '200':
        description: 科目ごとの残高と合計
        content:
          application/json:
            schema:
              $ref: '../schemas/reports.yaml#/AccountBalances'
      '401':
        description: 未認証
        content:
          application/json:
            schema:
              $ref: '../schemas/error.yaml#/ErrorResponse'
      '422':
        description: 基準日の指定が不正（`errors`）
        content:
          application/json:
            schema:
              $ref: '../schemas/error.yaml#/ErrorResponse'

monthly-expenses:
  get:
    tags: [reports]
    summary: 月次の支出
    description: |
      認証済みユーザーの費用を、対象月の費用科目ごとに集計して、金額の大きい順に返す。
      仕訳日が対象月の仕訳で数える。カード払いは買い物をした日の月に計上する。
      参照のみの API なので本文に `next_token` は含めず、新しいトークンはレスポンスヘッダ `X-Next-Token` で返す。
    operationId: getMonthlyExpenses
    security:
      - bearerAuth: []
    parameters:
      - name: month
        in: query
        description: 対象月（`YYYY-MM`）。省略すると今月（日本時間）。
        schema:
          type: string
          pattern: '^\d{4}-(0[1-9]|1[0-2])$'
          examples:
            - '2026-10'
    responses:
      '200':
        description: 科目ごとの支出と合計（該当が無い月は `total` が 0、`items` が空配列）
        content:
          application/json:
            schema:
              $ref: '../schemas/reports.yaml#/MonthlyExpenses'
      '401':
        description: 未認証
        content:
          application/json:
            schema:
              $ref: '../schemas/error.yaml#/ErrorResponse'
      '422':
        description: 対象月の指定が不正（`errors`）
        content:
          application/json:
            schema:
              $ref: '../schemas/error.yaml#/ErrorResponse'
