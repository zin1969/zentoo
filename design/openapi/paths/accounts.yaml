asset-accounts:
  get:
    tags: [accounts]
    summary: 資産勘定科目の一覧
    description: 認証済みユーザーの資産勘定科目のみ返す。新しいトークンはレスポンスヘッダ `X-Next-Token` で返す（本文に `next_token` は含めない）。
    operationId: listAssetAccounts
    security:
      - bearerAuth: []
    responses:
      '200':
        description: 資産勘定科目の配列
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '../schemas/accounts.yaml#/AssetAccount'
      '401':
        description: 未認証
        content:
          application/json:
            schema:
              $ref: '../schemas/error.yaml#/ErrorResponse'
  post:
    tags: [accounts]
    summary: 口座の追加
    description: |
      認証済みユーザーの口座（現金・預金・電子マネー）を追加する。
      現金の口座は 1 つだけ（現金の預け入れが、現金の口座が 1 つに決まることを前提にしているため）。
      401 以外では、本文に新しい `next_token` を返す。
    operationId: createAssetAccount
    security:
      - bearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../schemas/accounts.yaml#/AssetAccountRequest'
    responses:
      '201':
        description: 追加した
        content:
          application/json:
            schema:
              $ref: '../schemas/accounts.yaml#/AccountSavedResponse'
      '401':
        description: 未認証
        content:
          application/json:
            schema:
              $ref: '../schemas/error.yaml#/ErrorResponse'
      '422':
        description: バリデーションエラー（`errors`）、名前の重複（`duplicate_account_name`）、2 つ目の現金の口座（`cash_account_already_exists`）
        content:
          application/json:
            schema:
              $ref: '../schemas/error.yaml#/ErrorResponse'

asset-account:
  put:
    tags: [accounts]
    summary: 口座の変更
    description: |
      口座の名前と種別を変える。仕訳か決まった支払いで使われている口座と、カードの引き落とし口座になっている口座は、名前だけ変えられる。
      401 以外では、本文に新しい `next_token` を返す。
    operationId: updateAssetAccount
    security:
      - bearerAuth: []
    parameters:
      - name: id
        in: path
        required: true
        description: 口座の ID
        schema:
          type: integer
          minimum: 1
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../schemas/accounts.yaml#/AssetAccountRequest'
    responses:
      '200':
        description: 変更した
        content:
          application/json:
            schema:
              $ref: '../schemas/accounts.yaml#/AccountSavedResponse'
      '401':
        description: 未認証
        content:
          application/json:
            schema:
              $ref: '../schemas/error.yaml#/ErrorResponse'
      '404':
        description: 口座が存在しない、または他ユーザーの口座（`asset_account_not_found`）
        content:
          application/json:
            schema:
              $ref: '../schemas/error.yaml#/ErrorResponse'
      '422':
        description: バリデーションエラー（`errors`）、使用中の口座の種別の変更（`asset_account_in_use`）、名前の重複（`duplicate_account_name`）、2 つ目の現金の口座（`cash_account_already_exists`）
        content:
          application/json:
            schema:
              $ref: '../schemas/error.yaml#/ErrorResponse'
  delete:
    tags: [accounts]
    summary: 口座の削除
    description: |
      使われていない口座を削除する。仕訳か決まった支払いで使われている口座と、カードの引き落とし口座になっている口座は削除できない。
      成功時は本文を返さず、新しいトークンはレスポンスヘッダ `X-Next-Token` で返す（エラー時は本文の `next_token`）。
    operationId: deleteAssetAccount
    security:
      - bearerAuth: []
    parameters:
      - name: id
        in: path
        required: true
        description: 口座の ID
        schema:
          type: integer
          minimum: 1
    responses:
      '204':
        description: 削除した
      '401':
        description: 未認証
        content:
          application/json:
            schema:
              $ref: '../schemas/error.yaml#/ErrorResponse'
      '404':
        description: 口座が存在しない、または他ユーザーの口座（`asset_account_not_found`）
        content:
          application/json:
            schema:
              $ref: '../schemas/error.yaml#/ErrorResponse'
      '422':
        description: 使用中の口座（`asset_account_in_use`）
        content:
          application/json:
            schema:
              $ref: '../schemas/error.yaml#/ErrorResponse'

