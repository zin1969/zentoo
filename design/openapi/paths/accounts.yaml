asset-accounts:
  get:
    tags: [accounts]
    summary: 資産勘定科目の一覧
    description: 認証済みユーザーの資産勘定科目のみ返す。トークンのローテーション（`next_token`）は行わない。
    operationId: listAssetAccounts
    security:
      - bearerAuth: []
    responses:
      '200':
        description: 資産勘定科目の配列
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '../schemas/accounts.yaml#/AssetAccount'
      '401':
        description: 未認証
        content:
          application/json:
            schema:
              $ref: '../schemas/error.yaml#/ErrorResponse'

