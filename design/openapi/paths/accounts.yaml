    summary: 費用勘定科目の一覧
    description: 全ユーザー共通の費用勘定科目と、認証済みユーザー自身の費用勘定科目を返す。新しいトークンはレスポンスヘッダ `X-Next-Token` で返す（本文に `next_token` は含めない）。
    operationId: listExpenseAccounts
