    summary: 負債勘定科目の一覧
    description: 認証済みユーザーの負債勘定科目のみ返す。新しいトークンはレスポンスヘッダ `X-Next-Token` で返す（本文に `next_token` は含めない）。
    operationId: listLiabilityAccounts
