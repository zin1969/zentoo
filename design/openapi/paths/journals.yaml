journals:
  get:
    tags: [journals]
    summary: 仕訳の一覧
    description: |
      認証済みユーザーの仕訳を、日付の新しい順（同じ日付は ID の新しい順）に 50 件ずつ返す。
      クレジットカード払いの仕訳と、自動で作られた引き落とし仕訳は、互いの ID で結び付けて返す。
      参照のみの API なので本文に `next_token` は含めず、新しいトークンはレスポンスヘッダ `X-Next-Token` で返す。
    operationId: listJournals
    security:
      - bearerAuth: []
    parameters:
      - name: from
        in: query
        description: 期間の開始日（この日を含む）。省略すると開始日で絞らない。
        schema:
          type: string
          format: date
      - name: to
        in: query
        description: 期間の終了日（この日を含む）。省略すると終了日で絞らない。`from` より前の日付は指定できない。
        schema:
          type: string
          format: date
      - name: page
        in: query
        description: ページ番号（1 始まり）。省略すると 1。
        schema:
          type: integer
          minimum: 1
          default: 1
    responses:
      '200':
        description: 仕訳の一覧（該当が無い、またはページが範囲外なら `journals` は空配列）
        content:
          application/json:
            schema:
              $ref: '../schemas/journals.yaml#/JournalList'
      '401':
        description: 未認証
        content:
          application/json:
            schema:
              $ref: '../schemas/error.yaml#/ErrorResponse'
      '422':
        description: 期間・ページの指定が不正（`errors`）
        content:
          application/json:
            schema:
              $ref: '../schemas/error.yaml#/ErrorResponse'

asset-opening-journals:
  post:
    tags: [journals]
    summary: 開始残高（開始資産）仕訳の登録
    description: |
      資産勘定科目の開始残高を登録する。同じ勘定科目の開始残高は 1 件のみ登録できる。
      内部で PostgreSQL 関数 `create_opening_asset_balance_journal` を呼び出す。
      401 以外では新しい `next_token` を返す。
    operationId: createOpeningAssetBalanceJournal
    security:
      - bearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../schemas/journals.yaml#/CreateOpeningAssetBalanceJournalRequest'
    responses:
      '201':
        description: 登録成功
        content:
          application/json:
            schema:
              $ref: '../schemas/journals.yaml#/JournalCreatedResponse'
      '401':
        description: 未認証
        content:
          application/json:
            schema:
              $ref: '../schemas/error.yaml#/ErrorResponse'
      '404':
        description: 勘定科目が存在しない、または認証済みユーザーの科目ではない（error が asset_account_not_found。両者は区別しない）
        content:
          application/json:
            schema:
              $ref: '../schemas/error.yaml#/ErrorResponse'
      '409':
        description: 開始残高が既に登録されている（error が opening_asset_already_exists）
        content:
          application/json:
            schema:
              $ref: '../schemas/error.yaml#/ErrorResponse'
      '422':
        description: バリデーションエラー（`errors`）
        content:
          application/json:
            schema:
              $ref: '../schemas/error.yaml#/ErrorResponse'

journal-entries:
  post:
    tags: [journals]
    summary: 仕訳の登録
    description: |
      借方・貸方を指定して仕訳を登録する。
      貸方がクレジットカード払い（`element_type` が 2 で `payment_method_type` が 3）の場合、DB のトリガーが引き落とし日の仕訳を自動で作る
      （締日・支払日はカード設定に従い、土日・祝日・銀行休日は翌営業日にずらす）。
      内部で PostgreSQL 関数 `insert_journal_entry` を呼び出す。
      401 以外では新しい `next_token` を返す。
    operationId: insertJournalEntry
    security:
      - bearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../schemas/journals.yaml#/InsertJournalEntryRequest'
    responses:
      '201':
        description: 登録成功
        content:
          application/json:
            schema:
              $ref: '../schemas/journals.yaml#/JournalCreatedResponse'
      '401':
        description: 未認証
        content:
          application/json:
            schema:
              $ref: '../schemas/error.yaml#/ErrorResponse'
      '404':
        description: 借方・貸方の科目が存在しない、または使えない（error が account_not_found。資産・負債科目は本人のもののみ、費用・資本科目は共通科目か本人の科目のみ使える。存在しない科目と他人の科目は区別しない）
        content:
          application/json:
            schema:
              $ref: '../schemas/error.yaml#/ErrorResponse'
      '422':
        description: バリデーションエラー（errors）、貸借不一致（error が unbalanced_journal）、またはカード払いなのに引き落とし設定が無い（error が credit_card_setting_not_found）
        content:
          application/json:
            schema:
              $ref: '../schemas/error.yaml#/ErrorResponse'

cash-deposit-journals:
  post:
    tags: [journals]
    summary: 現金の預け入れ仕訳の登録
    description: |
      現金を預金口座に預け入れる仕訳（借方: 預金口座、貸方: 現金）を登録する。
      預け入れ先は、認証済みユーザーの預金口座のみ。貸方の現金科目は、ユーザーの現金科目が 1 つだけのときに限って、それを使う。
      内部で PostgreSQL 関数 `create_cash_deposit_journal` を呼び出す。
      401 以外では新しい `next_token` を返す。
    operationId: createCashDepositJournal
    security:
      - bearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../schemas/journals.yaml#/CreateCashDepositJournalRequest'
    responses:
      '201':
        description: 登録成功
        content:
          application/json:
            schema:
              $ref: '../schemas/journals.yaml#/JournalCreatedResponse'
      '401':
        description: 未認証
        content:
          application/json:
            schema:
              $ref: '../schemas/error.yaml#/ErrorResponse'
      '404':
        description: 預け入れ先が存在しない、他のユーザーの科目、または預金口座ではない（error が asset_account_not_found。これらは区別しない）
        content:
          application/json:
            schema:
              $ref: '../schemas/error.yaml#/ErrorResponse'
      '422':
        description: バリデーションエラー（errors）、またはユーザーの現金科目が 0 件・2 件以上で貸方を決められない（error が cash_account_not_determined）
        content:
          application/json:
            schema:
              $ref: '../schemas/error.yaml#/ErrorResponse'
