journals:
  get:
    tags: [journals]
    summary: 仕訳の一覧
    description: |
      認証済みユーザーの仕訳を、日付の新しい順（同じ日付は ID の新しい順）に 50 件ずつ返す。
      クレジットカード払いの仕訳と、自動で作られた引き落とし仕訳は、互いの ID で結び付けて返す。
      参照のみの API なので本文に `next_token` は含めず、新しいトークンはレスポンスヘッダ `X-Next-Token` で返す。
    operationId: listJournals
    security:
      - bearerAuth: []
    parameters:
      - name: from
        in: query
        description: 期間の開始日（この日を含む）。省略すると開始日で絞らない。
        schema:
          type: string
          format: date
      - name: to
        in: query
        description: 期間の終了日（この日を含む）。省略すると終了日で絞らない。`from` より前の日付は指定できない。
        schema:
          type: string
          format: date
      - name: page
        in: query
        description: ページ番号（1 始まり）。省略すると 1。
        schema:
          type: integer
          minimum: 1
          default: 1
      - name: q
        in: query
        description: |
          キーワード。店舗名（収入・振替では摘要）か、明細の品目に含まれる仕訳を返す（部分一致、大文字小文字を区別しない）。
          前後の空白は除く。`%` と `_` は文字として扱う。省略または空白だけなら絞らない。
        schema:
          type: string
      - name: element_type
        in: query
        description: |
          科目の要素（1: 資産、2: 負債、3: 元入金、4: 収益、5: 費用）。`account_id` と組で指定する。
        schema:
          type: integer
          enum: [1, 2, 3, 4, 5]
      - name: account_id
        in: query
        description: |
          科目・口座・カードの ID。借方・貸方のどちらかでこの科目を使っている仕訳を返す。`element_type` と組で指定する。
          費用科目・収益科目は、親の科目を指定すると子科目の仕訳も含める（共通科目か本人の科目だけが対象）。
          他人の科目を指定しても、何も返さないだけ（存在しない科目と区別しない）。
        schema:
          type: integer
          minimum: 1
      - name: tag_id
        in: query
        description: タグの ID。このタグが付いた明細のある仕訳を返す。他人のタグを指定しても、何も返さないだけ。
        schema:
          type: integer
          minimum: 1
    responses:
      '200':
        description: |
          仕訳の一覧（該当が無い、またはページが範囲外なら `journals` は空配列）。
          条件はすべて AND で絞り込む。`total_count` は条件に合う仕訳の数。明細は、条件に合わないものも含めて仕訳ごと返す。
        content:
          application/json:
            schema:
              $ref: '../schemas/journals.yaml#/JournalList'
      '401':
        description: 未認証
        content:
          application/json:
            schema:
              $ref: '../schemas/error.yaml#/ErrorResponse'
      '422':
        description: 期間・ページ・検索の条件の指定が不正（`errors`）
        content:
          application/json:
            schema:
              $ref: '../schemas/error.yaml#/ErrorResponse'

journal:
  get:
    tags: [journals]
    summary: 仕訳の取得（1 件）
    description: |
      認証済みユーザーの仕訳を 1 件返す。形は仕訳一覧の 1 件（`Journal`）と同じ。修正画面の初期値に使う。
      参照のみの API なので本文に `next_token` は含めず、新しいトークンはレスポンスヘッダ `X-Next-Token` で返す。
    operationId: getJournal
    security:
      - bearerAuth: []
    parameters:
      - name: id
        in: path
        required: true
        description: 仕訳の ID
        schema:
          type: integer
          minimum: 1
    responses:
      '200':
        description: 仕訳
        content:
          application/json:
            schema:
              $ref: '../schemas/journals.yaml#/Journal'
      '401':
        description: 未認証
        content:
          application/json:
            schema:
              $ref: '../schemas/error.yaml#/ErrorResponse'
      '404':
        description: 仕訳が存在しない、または他ユーザーの仕訳（`journal_not_found`。両者は区別しない）
        content:
          application/json:
            schema:
              $ref: '../schemas/error.yaml#/ErrorResponse'
  delete:
    tags: [journals]
    summary: 仕訳の削除
    description: |
      認証済みユーザーの仕訳を削除する。仕訳は DB から完全に消え、元に戻せない。
      クレジットカード払いの仕訳（開始負債を含む）を削除すると、自動で作られた引き落とし仕訳も一緒に削除する。
      引き落とし仕訳だけを削除することはできない（元の仕訳を削除する）。
      成功時は本文を返さない。新しいトークンは、成功・失敗（401 を除く）ともにレスポンスヘッダ `X-Next-Token` で返す。
    operationId: deleteJournal
    security:
      - bearerAuth: []
    parameters:
      - name: id
        in: path
        required: true
        description: 削除する仕訳の ID
        schema:
          type: integer
          minimum: 1
    responses:
      '204':
        description: 削除した
      '401':
        description: 未認証
        content:
          application/json:
            schema:
              $ref: '../schemas/error.yaml#/ErrorResponse'
      '404':
        description: 仕訳が存在しない、または他ユーザーの仕訳（`journal_not_found`。両者は区別しない）
        content:
          application/json:
            schema:
              $ref: '../schemas/error.yaml#/ErrorResponse'
      '422':
        description: 引き落とし仕訳は単独で削除できない（`direct_debit_journal_not_deletable`）
        content:
          application/json:
            schema:
              $ref: '../schemas/error.yaml#/ErrorResponse'

asset-opening-journals:
  post:
    tags: [journals]
    summary: 開始残高（開始資産）仕訳の登録
    description: |
      資産勘定科目の開始残高を登録する。同じ勘定科目の開始残高は 1 件のみ登録できる。
      内部で PostgreSQL 関数 `create_opening_asset_balance_journal` を呼び出す。
      401 以外では新しい `next_token` を返す。
    operationId: createOpeningAssetBalanceJournal
    security:
      - bearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../schemas/journals.yaml#/CreateOpeningAssetBalanceJournalRequest'
    responses:
      '201':
        description: 登録成功
        content:
          application/json:
            schema:
              $ref: '../schemas/journals.yaml#/JournalCreatedResponse'
      '401':
        description: 未認証
        content:
          application/json:
            schema:
              $ref: '../schemas/error.yaml#/ErrorResponse'
      '404':
        description: 勘定科目が存在しない、または認証済みユーザーの科目ではない（error が asset_account_not_found。両者は区別しない）
        content:
          application/json:
            schema:
              $ref: '../schemas/error.yaml#/ErrorResponse'
      '409':
        description: 開始残高が既に登録されている（error が opening_asset_already_exists）
        content:
          application/json:
            schema:
              $ref: '../schemas/error.yaml#/ErrorResponse'
      '422':
        description: バリデーションエラー（`errors`）
        content:
          application/json:
            schema:
              $ref: '../schemas/error.yaml#/ErrorResponse'

journal-entries:
  post:
    tags: [journals]
    summary: 仕訳の登録
    description: |
      借方・貸方を指定して仕訳を登録する。
      貸方がクレジットカード払い（`element_type` が 2 で `payment_method_type` が 3）の場合、DB のトリガーが引き落とし日の仕訳を自動で作る
      （締日・支払日はカード設定に従い、土日・祝日・銀行休日は翌営業日にずらす）。
      内部で PostgreSQL 関数 `insert_journal_entry` を呼び出す。
      401 以外では新しい `next_token` を返す。
    operationId: insertJournalEntry
    security:
      - bearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../schemas/journals.yaml#/InsertJournalEntryRequest'
    responses:
      '201':
        description: 登録成功
        content:
          application/json:
            schema:
              $ref: '../schemas/journals.yaml#/JournalCreatedResponse'
      '401':
        description: 未認証
        content:
          application/json:
            schema:
              $ref: '../schemas/error.yaml#/ErrorResponse'
      '404':
        description: 借方・貸方の科目が存在しない、または使えない（error が account_not_found。資産・負債科目は本人のもののみ、費用・資本科目は共通科目か本人の科目のみ使える。存在しない科目と他人の科目は区別しない）、または明細のタグが存在しない・他ユーザーのもの（error が tag_not_found）
        content:
          application/json:
            schema:
              $ref: '../schemas/error.yaml#/ErrorResponse'
      '422':
        description: バリデーションエラー（errors）、貸借不一致（error が unbalanced_journal）、カード払いなのに引き落とし設定が無い（error が credit_card_setting_not_found）、費用以外の明細にタグがある（error が tags_only_for_expense_debits）、または費用以外の明細に税率がある（error が tax_only_for_expense_debits）
        content:
          application/json:
            schema:
              $ref: '../schemas/error.yaml#/ErrorResponse'

journal-entry:
  put:
    tags: [journals]
    summary: お買い物の仕訳の修正
    description: |
      お買い物の仕訳（借方がすべて費用）を、新しい内容で作り直す。本文は仕訳の登録と同じ（借方はすべて費用にする）。
      内部で PostgreSQL 関数 `replace_journal_entry` を呼び出し、元の仕訳（とカード払いの引き落とし仕訳）を削除して、
      登録と同じ確認をしながら登録し直す。失敗した場合は、元の仕訳がそのまま残る。
      **仕訳の ID は変わる**。新しい ID を `journal_id` で返す。
      引き落とし仕訳、開始残高、預け入れは修正できない（削除して登録し直す）。
      401 以外では新しい `next_token` を返す。
    operationId: replaceJournalEntry
    security:
      - bearerAuth: []
    parameters:
      - name: id
        in: path
        required: true
        description: 修正する仕訳の ID
        schema:
          type: integer
          minimum: 1
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../schemas/journals.yaml#/InsertJournalEntryRequest'
    responses:
      '200':
        description: 修正成功（`journal_id` は作り直した仕訳の新しい ID）
        content:
          application/json:
            schema:
              $ref: '../schemas/journals.yaml#/JournalCreatedResponse'
      '401':
        description: 未認証
        content:
          application/json:
            schema:
              $ref: '../schemas/error.yaml#/ErrorResponse'
      '404':
        description: 仕訳が存在しない、または他ユーザーの仕訳（`journal_not_found`）。または科目が使えない（`account_not_found`）、明細のタグが使えない（`tag_not_found`）
        content:
          application/json:
            schema:
              $ref: '../schemas/error.yaml#/ErrorResponse'
      '422':
        description: |
          バリデーションエラー（`errors`）、引き落とし仕訳（`direct_debit_journal_not_editable`）、
          お買い物の仕訳ではない（`journal_not_editable`）、借方に費用以外がある（`expense_debits_required`）、
          貸借不一致（`unbalanced_journal`）、カードの引き落とし設定が無い（`credit_card_setting_not_found`）、費用以外の明細にタグがある（`tags_only_for_expense_debits`）、費用以外の明細に税率がある（`tax_only_for_expense_debits`）
        content:
          application/json:
            schema:
              $ref: '../schemas/error.yaml#/ErrorResponse'

cash-deposit-journals:
  post:
    tags: [journals]
    summary: 現金の預け入れ仕訳の登録（Web の画面は振替にまとめた。現金 → 預金の振替と同じ）
    description: |
      現金を預金口座に預け入れる仕訳（借方: 預金口座、貸方: 現金）を登録する。
      預け入れ先は、認証済みユーザーの預金口座のみ。貸方の現金科目は、ユーザーの現金科目が 1 つだけのときに限って、それを使う。
      内部で PostgreSQL 関数 `create_cash_deposit_journal` を呼び出す。
      401 以外では新しい `next_token` を返す。
    operationId: createCashDepositJournal
    security:
      - bearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../schemas/journals.yaml#/CreateCashDepositJournalRequest'
    responses:
      '201':
        description: 登録成功
        content:
          application/json:
            schema:
              $ref: '../schemas/journals.yaml#/JournalCreatedResponse'
      '401':
        description: 未認証
        content:
          application/json:
            schema:
              $ref: '../schemas/error.yaml#/ErrorResponse'
      '404':
        description: 預け入れ先が存在しない、他のユーザーの科目、または預金口座ではない（error が asset_account_not_found。これらは区別しない）
        content:
          application/json:
            schema:
              $ref: '../schemas/error.yaml#/ErrorResponse'
      '422':
        description: バリデーションエラー（errors）、またはユーザーの現金科目が 0 件・2 件以上で貸方を決められない（error が cash_account_not_determined）
        content:
          application/json:
            schema:
              $ref: '../schemas/error.yaml#/ErrorResponse'

liability-opening-journals:
  post:
    tags: [journals]
    summary: 開始負債（未払いのカード残高）仕訳の登録
    description: |
      開始時点で未払いのクレジットカードの残高を登録する。借方が元入金、貸方がカードの仕訳が作られる。
      あわせて、指定した引き落とし日の引き落とし仕訳（借方がカード、貸方が引き落とし口座）が自動で作られる。
      この日付は、カード払いと違って締日・支払日から計算せず、指定した日をそのまま使う。
      同じカードでも、引き落とし日が違えば複数登録できる。
      内部で PostgreSQL 関数 `create_opening_liability_balance_journal` を呼び出す。
      401 以外では新しい `next_token` を返す。
    operationId: createOpeningLiabilityBalanceJournal
    security:
      - bearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../schemas/journals.yaml#/CreateOpeningLiabilityBalanceJournalRequest'
    responses:
      '201':
        description: 登録成功（`journal_id` は開始負債の仕訳の ID）
        content:
          application/json:
            schema:
              $ref: '../schemas/journals.yaml#/JournalCreatedResponse'
      '401':
        description: 未認証
        content:
          application/json:
            schema:
              $ref: '../schemas/error.yaml#/ErrorResponse'
      '404':
        description: カードが存在しない、他のユーザーの科目、またはクレジットカードではない（error が liability_account_not_found。これらは区別しない）
        content:
          application/json:
            schema:
              $ref: '../schemas/error.yaml#/ErrorResponse'
      '409':
        description: 同じカード・同じ引き落とし日の開始負債が登録済み（error が opening_liability_already_exists）
        content:
          application/json:
            schema:
              $ref: '../schemas/error.yaml#/ErrorResponse'
      '422':
        description: バリデーションエラー（errors）、引き落とし日が開始日より前（error が payment_date_before_journal_date）、またはカードに引き落とし設定が無い（error が credit_card_setting_not_found）
        content:
          application/json:
            schema:
              $ref: '../schemas/error.yaml#/ErrorResponse'

direct-debit-journal:
  put:
    tags: [journals]
    summary: カードの引き落とし日の変更
    description: |
      カード払い（お買い物・開始負債）から自動で作られた引き落とし仕訳の日付だけを変える。金額・科目・口座は変えない。
      締め日の近くで買うと、カード会社の計上日の都合で引き落としが翌月になることがあるため、カードの明細の日付に合わせる。
      内部で PostgreSQL 関数 `update_direct_debit_date` を呼び出す。変えた仕訳は `payment_date_overridden` が true になり、
      元のお買い物を修正しても、同じカード 1 枚での支払いのままで、修正後の買った日より前にならなければ、変えた日を引き継ぐ。
      401 以外では新しい `next_token` を返す。
    operationId: updateDirectDebitDate
    security:
      - bearerAuth: []
    parameters:
      - name: id
        in: path
        required: true
        description: 引き落とし仕訳の ID（元のカード払い仕訳の ID ではない）
        schema:
          type: integer
          minimum: 1
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../schemas/journals.yaml#/UpdateDirectDebitDateRequest'
    responses:
      '200':
        description: 変更成功（`journal_id` は引き落とし仕訳の ID で、変わらない）
        content:
          application/json:
            schema:
              $ref: '../schemas/journals.yaml#/JournalCreatedResponse'
      '401':
        description: 未認証
        content:
          application/json:
            schema:
              $ref: '../schemas/error.yaml#/ErrorResponse'
      '404':
        description: 仕訳が存在しない、または他ユーザーの仕訳（`journal_not_found`。両者は区別しない）
        content:
          application/json:
            schema:
              $ref: '../schemas/error.yaml#/ErrorResponse'
      '422':
        description: |
          バリデーションエラー（`errors`）、引き落とし仕訳ではない（`not_direct_debit_journal`）、
          元の仕訳の日付より前（`payment_date_before_journal_date`）
        content:
          application/json:
            schema:
              $ref: '../schemas/error.yaml#/ErrorResponse'

income-journals:
  post:
    tags: [journals]
    summary: 収入の登録
    description: |
      収入の仕訳（借方: 入金先の口座、貸方: 収益科目）を登録する。入金先は本人の口座ならどれでもよい（預金・現金・電子マネー）。
      摘要（`description`）は仕訳の店舗名に入れ、空なら収益科目の名前を入れる（通帳の摘要に出る）。
      内部で PostgreSQL 関数 `create_income_journal` を呼び出す。
      401 以外では新しい `next_token` を返す。
    operationId: createIncomeJournal
    security:
      - bearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../schemas/journals.yaml#/IncomeJournalRequest'
    responses:
      '201':
        description: 登録成功
        content:
          application/json:
            schema:
              $ref: '../schemas/journals.yaml#/JournalCreatedResponse'
      '401':
        description: 未認証
        content:
          application/json:
            schema:
              $ref: '../schemas/error.yaml#/ErrorResponse'
      '404':
        description: 入金先の口座（`asset_account_not_found`）か収益科目（`revenue_account_not_found`）が存在しない、または他ユーザーのもの
        content:
          application/json:
            schema:
              $ref: '../schemas/error.yaml#/ErrorResponse'
      '422':
        description: バリデーションエラー（`errors`）
        content:
          application/json:
            schema:
              $ref: '../schemas/error.yaml#/ErrorResponse'

income-journal:
  put:
    tags: [journals]
    summary: 収入の修正
    description: |
      収入の仕訳（貸方がすべて収益）を、新しい内容で作り直す。本文は収入の登録と同じ。
      内部で PostgreSQL 関数 `replace_income_journal` を呼び出し、元の仕訳を削除して、登録と同じ確認をしながら登録し直す。
      失敗した場合は、元の仕訳がそのまま残る。**仕訳の ID は変わる**。新しい ID を `journal_id` で返す。
      401 以外では新しい `next_token` を返す。
    operationId: replaceIncomeJournal
    security:
      - bearerAuth: []
    parameters:
      - name: id
        in: path
        required: true
        description: 修正する仕訳の ID
        schema:
          type: integer
          minimum: 1
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../schemas/journals.yaml#/IncomeJournalRequest'
    responses:
      '200':
        description: 修正成功（`journal_id` は作り直した仕訳の新しい ID）
        content:
          application/json:
            schema:
              $ref: '../schemas/journals.yaml#/JournalCreatedResponse'
      '401':
        description: 未認証
        content:
          application/json:
            schema:
              $ref: '../schemas/error.yaml#/ErrorResponse'
      '404':
        description: 仕訳（`journal_not_found`）・入金先の口座（`asset_account_not_found`）・収益科目（`revenue_account_not_found`）が存在しない、または他ユーザーのもの
        content:
          application/json:
            schema:
              $ref: '../schemas/error.yaml#/ErrorResponse'
      '422':
        description: バリデーションエラー（`errors`）、収入の仕訳ではない（`journal_not_editable`）
        content:
          application/json:
            schema:
              $ref: '../schemas/error.yaml#/ErrorResponse'

transfer-journals:
  post:
    tags: [journals]
    summary: 振替の登録（引き出し・振替・チャージ）
    description: |
      振替の仕訳（借方: 入れる先の口座、貸方: 出す元の口座かクレジットカード）を登録する。
      ATM での引き出し（預金 → 現金）、預け入れ（現金 → 預金）、口座間の振替、電子マネーへのチャージ（現金・預金・カードから）に使う。
      クレジットカードから入れられるのは電子マネーだけで、お買い物のカード払いと同じく、引き落とし仕訳を自動で作る。
      摘要（`description`）が空なら、組み合わせから「引き出し」「預入」「チャージ」「振替」を入れる。
      内部で PostgreSQL 関数 `create_transfer_journal` を呼び出す。
      401 以外では新しい `next_token` を返す。
    operationId: createTransferJournal
    security:
      - bearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../schemas/journals.yaml#/TransferJournalRequest'
    responses:
      '201':
        description: 登録成功
        content:
          application/json:
            schema:
              $ref: '../schemas/journals.yaml#/JournalCreatedResponse'
      '401':
        description: 未認証
        content:
          application/json:
            schema:
              $ref: '../schemas/error.yaml#/ErrorResponse'
      '404':
        description: 出す元（`from_account_not_found`）か入れる先（`to_account_not_found`）が存在しない、または他ユーザーのもの
        content:
          application/json:
            schema:
              $ref: '../schemas/error.yaml#/ErrorResponse'
      '422':
        description: |
          バリデーションエラー（`errors`）、出す元と入れる先が同じ口座（`same_account`）、
          カードから電子マネー以外への振替（`credit_card_charge_requires_e_money`）、カードの引き落とし設定が無い（`credit_card_setting_not_found`）
        content:
          application/json:
            schema:
              $ref: '../schemas/error.yaml#/ErrorResponse'

transfer-journal:
  put:
    tags: [journals]
    summary: 振替の修正
    description: |
      振替の仕訳（借方が口座 1 つ、貸方が口座かクレジットカード 1 つ。以前の「現金の預け入れ」も含む）を、新しい内容で作り直す。本文は振替の登録と同じ。
      内部で PostgreSQL 関数 `replace_transfer_journal` を呼び出し、元の仕訳（とカードからのチャージの引き落とし仕訳）を削除して、登録と同じ確認をしながら登録し直す。
      失敗した場合は、元の仕訳がそのまま残る。**仕訳の ID は変わる**。カードからのチャージの引き落とし日は、自動の計算に戻る。
      401 以外では新しい `next_token` を返す。
    operationId: replaceTransferJournal
    security:
      - bearerAuth: []
    parameters:
      - name: id
        in: path
        required: true
        description: 修正する仕訳の ID
        schema:
          type: integer
          minimum: 1
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../schemas/journals.yaml#/TransferJournalRequest'
    responses:
      '200':
        description: 修正成功（`journal_id` は作り直した仕訳の新しい ID）
        content:
          application/json:
            schema:
              $ref: '../schemas/journals.yaml#/JournalCreatedResponse'
      '401':
        description: 未認証
        content:
          application/json:
            schema:
              $ref: '../schemas/error.yaml#/ErrorResponse'
      '404':
        description: 仕訳（`journal_not_found`）・出す元（`from_account_not_found`）・入れる先（`to_account_not_found`）が存在しない、または他ユーザーのもの
        content:
          application/json:
            schema:
              $ref: '../schemas/error.yaml#/ErrorResponse'
      '422':
        description: 登録と同じエラーと、振替の仕訳ではない（`journal_not_editable`）
        content:
          application/json:
            schema:
              $ref: '../schemas/error.yaml#/ErrorResponse'
