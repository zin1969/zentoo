ErrorResponse:
  type: object
  description: |
    エラー応答。`error`（機械可読なコード）または `errors`（バリデーションメッセージの配列）のいずれかが入る。
    401 の場合は `next_token` を返さない。
  properties:
    error:
      type: string
      examples:
        - unauthorized
        - opening_asset_already_exists
        - asset_account_not_found
        - account_not_found
        - unbalanced_journal
    errors:
      type: array
      items:
        type: string
    next_token:
      type: string
      description: 次のリクエストに使う JWT（401 では返らない）
