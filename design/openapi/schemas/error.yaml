ErrorResponse:
  type: object
  description: |
    エラー応答。`error`（機械可読なコード）または `errors`（バリデーションメッセージの配列）のいずれかが入る。
    401 の場合は `next_token` を返さない。
  properties:
    error:
      type: string
      examples:
        - unauthorized
        - opening_asset_already_exists
        - asset_account_not_found
        - account_not_found
        - credit_card_setting_not_found
        - unbalanced_journal
        - journal_not_found
        - direct_debit_journal_not_deletable
        - direct_debit_journal_not_editable
        - journal_not_editable
        - expense_debits_required
        - not_direct_debit_journal
        - payment_date_before_journal_date
        - asset_account_in_use
        - duplicate_account_name
        - cash_account_already_exists
        - credit_card_not_found
        - credit_card_in_use
        - bank_account_not_found
        - expense_account_not_found
        - expense_account_in_use
        - expense_account_has_children
        - invalid_parent
        - revenue_account_not_found
        - revenue_account_in_use
        - revenue_account_has_children
    errors:
      type: array
      items:
        type: string
    next_token:
      type: string
      description: 次のリクエストに使う JWT（401 では返らない）
