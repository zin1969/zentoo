CreateOpeningAssetBalanceJournalRequest:
  type: object
  required:
    - journal_date
    - asset_type
    - asset_account_id
    - amount
  properties:
    journal_date:
      type: string
      format: date
      examples:
        - '2026-02-01'
    asset_type:
      type: integer
      const: 1
      description: 要素種別（1 = 資産）
    asset_account_id:
      type: integer
      description: 資産勘定科目の ID（`GET /asset-accounts`）
    amount:
      type: integer
      minimum: 0
      examples:
        - 100000

CreateCashDepositJournalRequest:
  type: object
  description: ユーザー ID はトークンから決まるため、リクエストに含めても無視される。
  required:
    - journal_date
    - bank_account_id
    - amount
  properties:
    journal_date:
      type: string
      format: date
      description: 預け入れた日（過去・未来も指定できる）
      examples:
        - '2026-10-20'
    bank_account_id:
      type: integer
      description: 預け入れ先の預金口座の ID（`GET /asset-accounts` の `payment_method_type` が 2 のもの）
    amount:
      type: integer
      minimum: 1
      maximum: 2147483647
      examples:
        - 45000

CreateOpeningLiabilityBalanceJournalRequest:
  type: object
  description: ユーザー ID はトークンから決まるため、リクエストに含めても無視される。
  required:
    - journal_date
    - liability_account_id
    - amount
    - payment_date
  properties:
    journal_date:
      type: string
      format: date
      description: 開始日（開始資産の登録と同じ日にそろえる）
      examples:
        - '2026-10-30'
    liability_account_id:
      type: integer
      description: カード（負債科目）の ID（`GET /liability-accounts`）
    amount:
      type: integer
      minimum: 1
      maximum: 2147483647
      description: 未払いの金額
      examples:
        - 30000
    payment_date:
      type: string
      format: date
      description: 引き落とし日（カードの明細にある支払日）。開始日以降。土日・祝日でもずらさない。
      examples:
        - '2026-11-10'

JournalCreatedResponse:
  type: object
  required:
    - journal_id
    - next_token
  properties:
    journal_id:
      type: integer
    next_token:
      type: string
      description: 次のリクエストに使う JWT

InsertJournalEntryRequest:
  type: object
  description: |
    借方合計と貸方合計は一致している必要がある。
    ユーザー ID はトークンから決まるため、リクエストに含めても無視される。
  required:
    - date
    - debits
    - credits
  properties:
    date:
      type: string
      format: date
      examples:
        - '2026-07-19'
    store_name:
      type: string
      examples:
        - ピザーラ
    debits:
      type: array
      minItems: 1
      items:
        type: object
        required:
          - element_type
          - account_id
          - amount
        properties:
          element_type:
            type: integer
            enum: [1, 2, 3, 4, 5]
            description: 1 = 資産, 2 = 負債, 3 = 元入金, 4 = 収益, 5 = 費用
          account_id:
            type: integer
          amount:
            type: integer
          item_name:
            type: string
    credits:
      type: array
      minItems: 1
      items:
        type: object
        required:
          - element_type
          - account_id
          - amount
        properties:
          element_type:
            type: integer
            enum: [1, 2, 3, 4, 5]
          payment_method_type:
            type: integer
          account_id:
            type: integer
          amount:
            type: integer

JournalList:
  type: object
  required: [journals, page, per_page, total_count]
  properties:
    journals:
      type: array
      items:
        $ref: '#/Journal'
    page:
      type: integer
    per_page:
      type: integer
      examples:
        - 50
    total_count:
      type: integer
      description: 期間に該当する仕訳の総数

Journal:
  type: object
  required:
    - id
    - journal_date
    - debits
    - credits
    - original_journal_id
    - direct_debit_journal_id
  properties:
    id:
      type: integer
    journal_date:
      type: string
      format: date
    store_name:
      type: [string, 'null']
    debits:
      type: array
      items:
        type: object
        required: [element_type, account_id, account_name, amount]
        properties:
          element_type:
            type: integer
          account_id:
            type: integer
          account_name:
            type: [string, 'null']
          item_name:
            type: [string, 'null']
          amount:
            type: integer
    credits:
      type: array
      items:
        type: object
        required: [element_type, payment_method_type, account_id, account_name, amount]
        properties:
          element_type:
            type: integer
          payment_method_type:
            type: integer
          account_id:
            type: integer
          account_name:
            type: [string, 'null']
          amount:
            type: integer
    original_journal_id:
      type: [integer, 'null']
      description: この仕訳が引き落とし仕訳の場合、元のカード払い仕訳の ID
    direct_debit_journal_id:
      type: [integer, 'null']
      description: この仕訳がカード払いの場合、引き落とし仕訳の ID
