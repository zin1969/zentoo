CreateOpeningAssetBalanceJournalRequest:
  type: object
  required:
    - journal_date
    - asset_type
    - asset_account_id
    - amount
  properties:
    journal_date:
      type: string
      format: date
      examples:
        - '2026-02-01'
    asset_type:
      type: integer
      const: 1
      description: 要素種別（1 = 資産）
    asset_account_id:
      type: integer
      description: 資産勘定科目の ID（`GET /asset-accounts`）
    amount:
      type: integer
      minimum: 0
      description: 株の銘柄のときは 株数 × 平均取得単価（円未満は画面で四捨五入）
      examples:
        - 100000
    shares:
      type: [integer, 'null']
      minimum: 1
      maximum: 2147483647
      description: |
        株数（任意）。渡すと株の銘柄の開始残高になり、借方の明細に株数を持たせる。
        株数を持てるのは種別「投資」の口座（銘柄）だけ。iDeCo・NISA のように株数を持たないものは省略する

StockTradeRequest:
  type: object
  description: ユーザー ID はトークンから決まるため、リクエストに含めても無視される。
  required:
    - trade_type
    - journal_date
    - stock_account_id
    - securities_account_id
    - shares
    - amount
  properties:
    trade_type:
      type: string
      enum: [buy, sell]
      description: 買い（`buy`）か売り（`sell`）か
    journal_date:
      type: string
      format: date
      description: 約定日
    stock_account_id:
      type: integer
      minimum: 1
      maximum: 2147483647
      description: 銘柄（本人の種別「投資」の口座）の ID
    securities_account_id:
      type: integer
      minimum: 1
      maximum: 2147483647
      description: 証券口座（本人の種別「証券口座（預り金）」の口座）の ID
    shares:
      type: integer
      minimum: 1
      maximum: 2147483647
      description: 株数
    amount:
      type: integer
      minimum: 1
      maximum: 2147483647
      description: 受渡金額。買いは証券口座から出ていった額（手数料込み。手数料も取得額に含める）、売りは証券口座に入った額（手数料・税金を引いたあと）

SettlementJournalRequest:
  type: object
  description: ユーザー ID はトークンから決まるため、リクエストに含めても無視される。
  required:
    - journal_date
    - receivable_account_id
    - settled_amount
    - received_amount
  properties:
    journal_date:
      type: string
      format: date
    receivable_account_id:
      type: integer
      minimum: 1
      description: 立替金の口座（本人の種別 6 の口座）の ID
    settled_amount:
      type: integer
      minimum: 1
      maximum: 2147483647
      description: 消し込む額（立替金から減らす額）
    received_amount:
      type: integer
      minimum: 0
      maximum: 2147483647
      description: 受け取った額。全額おごりになったときは 0
    to_account_id:
      type: [integer, 'null']
      minimum: 1
      description: 入金先の口座（本人の、立替金以外の口座）。受け取った額が 1 以上のときに必須。0 のときは無視する
    difference_account_id:
      type: [integer, 'null']
      minimum: 1
      description: |
        差額（消し込む額 − 受け取った額）の科目。少なく受け取ったら費用科目、多く受け取ったら収益科目（共通か本人の科目）。
        差額があるときに必須。差額が無いときは無視する
    description:
      type: [string, 'null']
      maxLength: 100
      description: 摘要。空なら「精算 立替金の口座名」

CreateCashDepositJournalRequest:
  type: object
  description: ユーザー ID はトークンから決まるため、リクエストに含めても無視される。
  required:
    - journal_date
    - bank_account_id
    - amount
  properties:
    journal_date:
      type: string
      format: date
      description: 預け入れた日（過去・未来も指定できる）
      examples:
        - '2026-10-20'
    bank_account_id:
      type: integer
      description: 預け入れ先の預金口座の ID（`GET /asset-accounts` の `payment_method_type` が 2 のもの）
    amount:
      type: integer
      minimum: 1
      maximum: 2147483647
      examples:
        - 45000

CreateOpeningLiabilityBalanceJournalRequest:
  type: object
  description: ユーザー ID はトークンから決まるため、リクエストに含めても無視される。
  required:
    - journal_date
    - liability_account_id
    - amount
    - payment_date
  properties:
    journal_date:
      type: string
      format: date
      description: 開始日（開始資産の登録と同じ日にそろえる）
      examples:
        - '2026-10-30'
    liability_account_id:
      type: integer
      description: カード（負債科目）の ID（`GET /liability-accounts`）
    amount:
      type: integer
      minimum: 1
      maximum: 2147483647
      description: 未払いの金額
      examples:
        - 30000
    payment_date:
      type: string
      format: date
      description: 引き落とし日（カードの明細にある支払日）。開始日以降。土日・祝日でもずらさない。
      examples:
        - '2026-11-10'

JournalCreatedResponse:
  type: object
  required:
    - journal_id
    - next_token
  properties:
    journal_id:
      type: integer
    next_token:
      type: string
      description: 次のリクエストに使う JWT

UpdateDirectDebitDateRequest:
  type: object
  required:
    - payment_date
  properties:
    payment_date:
      type: string
      format: date
      description: 新しい引き落とし日。元の仕訳の日付（買った日。開始負債なら開始日）より前にはできない。土日・祝日でも営業日にずらさない

InsertJournalEntryRequest:
  type: object
  description: |
    借方合計と貸方合計は一致している必要がある。
    ユーザー ID はトークンから決まるため、リクエストに含めても無視される。
  required:
    - date
    - debits
    - credits
  properties:
    date:
      type: string
      format: date
      examples:
        - '2026-07-19'
    store_name:
      type: string
      examples:
        - ピザーラ
    debits:
      type: array
      minItems: 1
      items:
        type: object
        required:
          - element_type
          - account_id
          - amount
        properties:
          element_type:
            type: integer
            enum: [1, 2, 3, 4, 5]
            description: 1 = 資産, 2 = 負債, 3 = 元入金, 4 = 収益, 5 = 費用
          account_id:
            type: integer
          amount:
            type: integer
          item_name:
            type: string
          tag_ids:
            type: array
            maxItems: 10
            items:
              type: integer
              minimum: 1
            description: 明細に付けるタグ（本人のタグの ID）。費用の明細にだけ付けられる。省略すると付けない
          tax_rate:
            type: integer
            minimum: 0
            maximum: 100
            description: 外税のレシートで登録した明細の税率（整数の %）。tax_excluded_amount と一緒に送る。費用の明細にだけ付けられる。表示のためだけに保存し、amount は税込のまま
          tax_excluded_amount:
            type: integer
            minimum: 0
            description: 外税のレシートで登録した明細の税抜の金額（0 から amount まで）。tax_rate と一緒に送る。消費税は amount - tax_excluded_amount
    credits:
      type: array
      minItems: 1
      items:
        type: object
        required:
          - element_type
          - account_id
          - amount
        properties:
          element_type:
            type: integer
            enum: [1, 2, 3, 4, 5]
          payment_method_type:
            type: integer
          account_id:
            type: integer
          amount:
            type: integer

JournalList:
  type: object
  required: [journals, page, per_page, total_count]
  properties:
    journals:
      type: array
      items:
        $ref: '#/Journal'
    page:
      type: integer
    per_page:
      type: integer
      examples:
        - 50
    total_count:
      type: integer
      description: 期間に該当する仕訳の総数
    account_totals:
      type: ['object', 'null']
      description: |
        `element_type` と `account_id` で科目を指定したときだけ、条件に合う仕訳全体（全ページ）での、
        その科目（費用・収益科目は子科目も含む）の借方合計・貸方合計。指定しないときは null
      required: [debit_total, credit_total]
      properties:
        debit_total:
          type: integer
        credit_total:
          type: integer

Journal:
  type: object
  required:
    - id
    - journal_date
    - debits
    - credits
    - original_journal_id
    - payment_date_overridden
    - direct_debit_journal_id
  properties:
    id:
      type: integer
    journal_date:
      type: string
      format: date
    store_name:
      type: [string, 'null']
    debits:
      type: array
      items:
        type: object
        required: [element_type, account_id, account_name, asset_type, amount, tax_rate, tax_excluded_amount, shares, tags]
        properties:
          element_type:
            type: integer
          account_id:
            type: integer
          account_name:
            type: [string, 'null']
          asset_type:
            type: [integer, 'null']
            description: 資産の明細の口座の種別（6 = 立替金など）。資産以外の明細は null
          item_name:
            type: [string, 'null']
          amount:
            type: integer
            description: 税込の金額
          tax_rate:
            type: [integer, 'null']
            description: 外税のレシートで登録した明細の税率（整数の %）。内税の明細は null
          tax_excluded_amount:
            type: [integer, 'null']
            description: 外税のレシートで登録した明細の税抜の金額。内税の明細は null。消費税は amount - tax_excluded_amount
          shares:
            type: [integer, 'null']
            description: 株の銘柄の株数（開始残高・買いで増える）。それ以外の明細は null
          tags:
            type: array
            description: 明細に付いているタグ（お買い物の費用の明細だけ）
            items:
              $ref: '../schemas/tags.yaml#/TagRef'
    credits:
      type: array
      items:
        type: object
        required: [element_type, payment_method_type, account_id, account_name, amount, shares]
        properties:
          element_type:
            type: integer
          payment_method_type:
            type: integer
          account_id:
            type: integer
          account_name:
            type: [string, 'null']
          amount:
            type: integer
          shares:
            type: [integer, 'null']
            description: 株の銘柄の株数（売りで減る）。それ以外の明細は null
    original_journal_id:
      type: [integer, 'null']
      description: この仕訳が引き落とし仕訳の場合、元のカード払い仕訳の ID
    payment_date_overridden:
      type: boolean
      description: 引き落とし仕訳の日付を手で変えたか（`PUT /direct-debit-journals/{id}`）。引き落とし仕訳以外は false
    direct_debit_journal_id:
      type: [integer, 'null']
      description: この仕訳がカード払いの場合、引き落とし仕訳の ID

IncomeJournalRequest:
  type: object
  required:
    - journal_date
    - asset_account_id
    - revenue_account_id
    - amount
  properties:
    journal_date:
      type: string
      format: date
    asset_account_id:
      type: integer
      minimum: 1
      description: 入金先の口座（本人の口座。種別は問わない）
    revenue_account_id:
      type: integer
      minimum: 1
      description: 収益科目（共通科目か本人の科目）
    amount:
      type: integer
      minimum: 1
      maximum: 2147483647
    description:
      type: [string, 'null']
      maxLength: 100
      description: 摘要（支払元など）。空なら収益科目の名前を入れる

TransferJournalRequest:
  type: object
  required:
    - journal_date
    - from_type
    - from_account_id
    - to_account_id
    - amount
  properties:
    journal_date:
      type: string
      format: date
    from_type:
      type: string
      enum: [asset, credit_card]
      description: 出す元が口座（`asset`）か、クレジットカード（`credit_card`。電子マネーへのチャージだけ）か
    from_account_id:
      type: integer
      minimum: 1
      description: 出す元の口座、またはカード（負債科目）の ID
    to_account_id:
      type: integer
      minimum: 1
      description: 入れる先の口座（本人の口座。出す元と同じにはできない）
    amount:
      type: integer
      minimum: 1
      maximum: 2147483647
    description:
      type: [string, 'null']
      maxLength: 100
      description: 摘要。空なら組み合わせから決める（預金 → 現金は「引き出し」、現金 → 預金は「預入」、電子マネーへは「チャージ」、それ以外は「振替」）
