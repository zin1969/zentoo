version: 2
updates:
  # Rails API (apps/api/Gemfile)
  - package-ecosystem: bundler
    directory: "/apps/api"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      bundler-minor-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch

  # Next.js frontend (apps/web/package-lock.json)
  - package-ecosystem: npm
    directory: "/apps/web"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch

  # GitHub Actions workflows (.github/workflows/*)
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      actions:
        applies-to: version-updates
        update-types:
          - minor
          - patch
