# Rails API と PostgreSQL の Kamal 設定。Next.js は config/deploy_web.yml。手順は docs/deployment.md。
# 公開リポジトリなので、IP アドレスとユーザー名は環境変数で渡す。
service: zentoo-api

image: <%= ENV.fetch("ZENTOO_REGISTRY_USER") %>/zentoo-api

# 外部に公開しないので kamal-proxy を通さない。Next.js からは kamal ネットワークの名前（zentoo-api）で呼ぶ
servers:
  web:
    hosts:
      - <%= ENV.fetch("ZENTOO_HOST") %>
    proxy: false
    options:
      network-alias: zentoo-api

# proxy がないので、Dockerfile の HEALTHCHECK で起動を待つ。最初の確認は起動の 30 秒後になる
deploy_timeout: 90

registry:
  server: ghcr.io
  username: <%= ENV.fetch("ZENTOO_REGISTRY_USER") %>
  password:
    - KAMAL_REGISTRY_PASSWORD

env:
  secret:
    - SECRET_KEY_BASE
    - JWT_SECRET_KEY
    - DB_PASSWORD
<% if ENV["SEED_USER_PASSWORD"].to_s != "" %>
    # 空の DB の初回起動にだけ必要。ログインできたら環境変数ごと消す
    - SEED_USER_PASSWORD
<% end %>
  clear:
    DB_HOST: zentoo-api-db
    DB_PORT: 5432
    DB_USER: zentoo

aliases:
  console: app exec --interactive --reuse "bin/rails console"
  shell: app exec --interactive --reuse "bash"
  logs: app logs -f
  dbc: app exec --interactive --reuse "bin/rails dbconsole --include-password"

builder:
  arch: amd64

ssh:
  user: deploy

accessories:
  # ポートは公開しない。接続は kamal ネットワークの中（zentoo-api-db:5432）からだけ
  db:
    image: postgres:17
    host: <%= ENV.fetch("ZENTOO_HOST") %>
    env:
      clear:
        POSTGRES_USER: zentoo
      secret:
        - POSTGRES_PASSWORD:DB_PASSWORD
    directories:
      - data:/var/lib/postgresql/data
